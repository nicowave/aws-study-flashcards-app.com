# Builds each app in the monorepo. Note: package-lock.json is gitignored,
# so we use `npm install` (npm ci requires a lockfile) and skip the npm cache.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [aws-study-homepage, aws-cloud-practitioner-game, aws-ai-study-game, aws-saa-study-game, aws-dva-study-game, aws-dev-track, aws-coding-courses, aws-backend]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
    - uses: actions/checkout@v4
    # 22: the courses' jsdom 30 needs Node ^22.22 (Promise.withResolvers), and the Lambdas run on Node 22
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install
    - run: npm run build
    # Component tests, plus (in the four games) the official-sources check on every question and card.
    # In aws-coding-courses: the shell, Python, JS/TS engines and every tutorial's answer run through its own check.
    - if: contains(fromJSON('["aws-cloud-practitioner-game","aws-saa-study-game","aws-dva-study-game","aws-ai-study-game","aws-study-homepage","aws-dev-track","aws-coding-courses"]'), matrix.app)
      run: npm test
    # Backend tests (checkout guards, return URLs, trial rules) load the payments Lambda, which has its own dependencies
    - if: matrix.app == 'aws-backend'
      run: (cd lambda/callables && npm install) && npm test
