# Builds each app in the monorepo. Note: package-lock.json is gitignored,
# so we use `npm install` (npm ci requires a lockfile) and skip the npm cache.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [aws-study-homepage, aws-cloud-practitioner-game, aws-ai-study-game]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm install
    - run: npm run build
